[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hardware-design-kit"
version = "0.1.0"
description = "Design calculators for power-input protection and EMI filters, cross-checked against ngspice."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mehdi Belhaj" }]
keywords = ["power electronics", "EMI filter", "TVS", "inrush", "hold-up", "DO-160", "EMC"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://mehdi-belhaj-eea.github.io"

[tool.setuptools.packages.find]
include = ["hdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
