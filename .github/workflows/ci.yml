name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - name: Install the package
        run: pip install -e ".[dev]"
      - name: Run the tests (including the ngspice cross-checks)
        run: pytest -v
      - name: Run the examples
        run: |
          python examples/aero_28v_protection.py
          python examples/industrial_48v_emi.py
